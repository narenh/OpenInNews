<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; --accent: #4f46e5; }
    body { margin: 0; padding: 14px 16px; min-width: 260px; font: 15px -apple-system, system-ui, sans-serif; }
    #open { display: block; width: 100%; padding: 12px; border: 0; border-radius: 12px;
            background: var(--accent); color: #fff; font: 600 16px -apple-system, system-ui, sans-serif; }
    #open:disabled { opacity: .45; }
    #note { min-height: 1.3em; margin: 8px 2px 10px; color: GrayText; font-size: 13px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 2px;
           border-top: 0.5px solid color-mix(in srgb, currentColor 20%, transparent); }
    .row small { display: block; color: GrayText; font-size: 12px; }
    input { accent-color: var(--accent); width: 20px; height: 20px; }
  </style>
</head>
<body>
  <button id="open">Open in News</button>
  <div id="note"></div>
  <label class="row"><span>Use on <b id="site"></b><small>Check articles on this site as they load</small></span><input type="checkbox" id="site-on"></label>
  <label class="row"><span>Open automatically<small>Otherwise, tap the button on the page</small></span><input type="checkbox" id="auto"></label>
  <script src="popup.js"></script>
</body>
</html>
