<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; --accent: #4f46e5; }
    body { margin: 0; padding: 14px 16px; min-width: 260px; font: 15px -apple-system, system-ui, sans-serif; }
    #open { display: block; width: 100%; padding: 12px; border: 0; border-radius: 12px;
            background: var(--accent); color: #fff; font: 600 16px -apple-system, system-ui, sans-serif; }
    #open:disabled { opacity: .45; }
    #note { min-height: 1.3em; margin: 8px 2px 10px; color: GrayText; font-size: 13px; }
    #site-settings { border-top: 0.5px solid color-mix(in srgb, currentColor 20%, transparent); padding: 10px 2px 0; }
    #site-label { margin-bottom: 8px; overflow-wrap: anywhere; }
    .seg { display: flex; padding: 2px; gap: 2px; border-radius: 9px; background: color-mix(in srgb, currentColor 12%, transparent); }
    .seg button { flex: 1; padding: 7px 4px; border: 0; border-radius: 7px; background: transparent; color: inherit;
                  font: 500 14px -apple-system, system-ui, sans-serif; }
    .seg button[aria-checked="true"] { background: var(--accent); color: #fff; font-weight: 600; }
    #mode-hint { min-height: 2.6em; margin: 8px 2px 0; color: GrayText; font-size: 12px; }
  </style>
</head>
<body>
  <button id="open">Open in News</button>
  <div id="note"></div>
  <div id="site-settings">
    <div id="site-label">On <b id="site"></b></div>
    <div class="seg" role="radiogroup" aria-label="Mode for this site">
      <button type="button" role="radio" data-mode="off">Off</button>
      <button type="button" role="radio" data-mode="ask">Ask</button>
      <button type="button" role="radio" data-mode="auto">Auto</button>
    </div>
    <div id="mode-hint"></div>
  </div>
  <script src="compat.js"></script>
  <script src="popup.js"></script>
</body>
</html>
